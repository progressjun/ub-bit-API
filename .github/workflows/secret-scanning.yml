name: Secret scanning
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1'

permissions:
  contents: read

jobs:
  git-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect leaked credentials (all branches, redacted)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact=100 --log-opts="--all" /repo
