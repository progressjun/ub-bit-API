# 단타(업무 시간 대리매매) 프로파일.
#
# 전제: 업무 시간 동안 봇이 대신 회전시킨다. 저녁에는 포지션을 남기지 않는다.
#
# 이 프로파일의 가장 중요한 설정은 전략 파라미터가 아니라 아래 두 가지다.
#   universe_auto : 종목을 고정하지 않는다. BTC/ETH 15분봉은 ATR%가 손익분기에
#                   미치지 못해 구조적으로 단타가 성립하지 않는다.
#   daily_trade_limit : 회전수가 곧 확정 비용이다. 8회전 = 하루 1.59% 선지출.

mode: paper

engine:
  markets: []                # universe_auto 사용 시 비워둔다
  universe_auto: true
  universe_refresh_minutes: 60
  candle_unit: 15            # 5분봉은 대부분 종목에서 ATR%가 비용을 못 넘긴다
  candle_count: 200
  poll_seconds: 20
  initial_krw: 1000000
  db_path: data/scalp.db
  param_file: data/params.json
  adaptive_params: false     # optimize --apply 로 승격한 뒤 true 로 전환
  log_level: INFO
  kill_switch_file: .KILL
  dynamic_slippage: true
  liquidity_min_value_krw: 50000000

session:
  enabled: true
  start: "09:00"             # KST
  end: "18:00"
  days: [0, 1, 2, 3, 4]      # 월~금
  no_entry_before_close_minutes: 20
  flatten_at_close: true     # 장 마감 전량 청산 — 오버나이트 갭 리스크 차단

universe:
  top_n: 4
  min_turnover_krw: 30000000000   # 24h 300억
  atr_cost_multiple: 4.0
  atr_max_pct: 0.06
  sample_bars: 120
  probe_order_krw: 500000
  max_round_trip_cost: 0.004      # 실측 왕복비용 0.4% 초과 종목은 제외
  exclude_warning: true

cost:
  fee_buy: 0.0005
  fee_sell: 0.0005
  slippage_buy: 0.0008       # 단타 대상은 유동성이 낮으므로 기본 가정을 높게 잡는다
  slippage_sell: 0.0008
  min_order_krw: 5000

strategy:
  ema_fast: 12
  ema_slow: 40
  trend_slope_lookback: 8
  breakout_period: 15
  rsi_period: 14
  rsi_min: 50
  rsi_max: 80
  atr_period: 14
  atr_cost_multiple: 4.0
  atr_max_pct: 0.06
  volume_period: 20
  volume_expansion: 1.3
  stop_atr: 1.2              # 단타는 손절을 짧게, 대신 사이즈로 보정
  trail_atr: 1.5
  take_profit_atr: 2.5
  min_net_target: 0.006      # 순 0.6% = 왕복비용(0.26%)의 2.3배
  max_hold_bars: 28          # 15분봉 28봉 = 7시간 (하루 안에 정리)
  warmup_bars: 60

risk:
  risk_per_trade: 0.004
  max_position_pct: 0.25
  max_total_exposure: 0.60
  max_concurrent: 2
  daily_loss_limit: 0.025    # 일 -2.5%
  daily_trade_limit: 6       # 6회전 확정 비용 1.55% < 손실한도 2.5%
  consecutive_loss_pause: 2
  cooldown_minutes: 90
  reentry_cooldown_minutes: 45
  min_order_krw: 5000
  max_order_krw: 500000
  dust_guard: 2.0        # 진입 하한 = 5,000 × 2.0 = 10,000원 (매도 불가 포지션 방지)
  conviction_max: 1.6    # 신호 강도에 따른 사이즈 배수 상한

walk_forward:
  train_bars: 1200
  test_bars: 300
  step_bars: 300

promotion:
  min_trades: 30
  min_folds: 3
  margin: 0.01
  max_drawdown: 0.15
  consistency: 0.6
  require_positive: true
