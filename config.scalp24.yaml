# 24시간 풀오토 단타 프로파일.
#
# ⚠ 이 설정의 수익성은 입증되지 않았다. 측정 결과는 아래와 같다.
#
#   15분봉 OOS 300거래(23종목) 몬테카를로:
#     전체        → 중앙값 +27.8%, 흑자확률 82.2%
#     상위 1건 제외 → 중앙값  +2.0%, 흑자확률 52.7%
#     상위 5건 제외 → 중앙값  -9.3%, 흑자확률 35.1%
#
#   300건 중 단 1건(+223.5%)이 결과를 뒤집는다. 그 한 건을 못 잡으면
#   동전던지기이고, 다섯 건을 못 잡으면 적자다.
#
#   거래당 5% 절사평균: 업무시간 -0.38%, 야간 -0.23% (둘 다 음수)
#   시간대 효과 순열검정: p=0.5715 (24시간이든 업무시간이든 차이 없음)
#
# 그럼에도 돌려보려면 페이퍼로만 하고, 실거래 전에 반드시 재검증할 것.
#
# 설정 요지
#   session.enabled: false  → 24시간 운용. 장마감 청산이 없으므로 오버나이트
#                             갭 리스크를 그대로 진다. max_hold_bars 로만 제한된다.
#   universe_auto           → 종목 고정 금지. BTC/ETH 15분봉은 ATR%가 손익분기에
#                             미달해 구조적으로 단타가 성립하지 않는다.
#   daily_trade_limit       → 회전수가 곧 확정 비용이다. 6회전 = 하루 1.55% 선지출.
#                             24시간 운용은 기회가 늘어나는 만큼 이 한도가 더 중요하다.

mode: paper

engine:
  markets: []                # universe_auto 사용 시 비워둔다
  universe_auto: true
  universe_refresh_minutes: 60
  candle_unit: 15            # 5분봉은 대부분 종목에서 ATR%가 비용을 못 넘긴다
  candle_count: 200
  poll_seconds: 20
  initial_krw: 1000000
  db_path: data/scalp24.db
  param_file: data/params.json
  adaptive_params: false     # optimize --apply 로 승격한 뒤 true 로 전환
  log_level: INFO
  kill_switch_file: .KILL
  dynamic_slippage: true
  liquidity_min_value_krw: 50000000

session:
  enabled: false             # 24시간 운용
  start: "09:00"             # enabled: true 로 바꾸면 업무시간 모드가 된다
  end: "18:00"
  days: [0, 1, 2, 3, 4]
  no_entry_before_close_minutes: 20
  flatten_at_close: true

universe:
  top_n: 4
  min_turnover_krw: 30000000000   # 24h 300억
  atr_cost_multiple: 4.0
  atr_max_pct: 0.06
  sample_bars: 120
  probe_order_krw: 500000
  max_round_trip_cost: 0.004      # 실측 왕복비용 0.4% 초과 종목은 제외
  exclude_warning: true

cost:
  fee_buy: 0.0005
  fee_sell: 0.0005
  slippage_buy: 0.0008       # 단타 대상은 유동성이 낮으므로 기본 가정을 높게 잡는다
  slippage_sell: 0.0008
  min_order_krw: 5000

strategy:
  ema_fast: 12
  ema_slow: 40
  trend_slope_lookback: 8
  breakout_period: 15
  rsi_period: 14
  rsi_min: 50
  rsi_max: 80
  atr_period: 14
  atr_cost_multiple: 4.0
  atr_max_pct: 0.06
  volume_period: 20
  volume_expansion: 1.3
  stop_atr: 1.2              # 단타는 손절을 짧게, 대신 사이즈로 보정
  trail_atr: 1.5
  take_profit_atr: 2.5
  min_net_target: 0.006      # 순 0.6% = 왕복비용(0.26%)의 2.3배
  max_hold_bars: 28          # 15분봉 28봉 = 7시간. 24시간 운용에서는 이것이
                             # 유일한 보유 상한이다. 장마감 청산이 없기 때문이다.
  warmup_bars: 60

risk:
  risk_per_trade: 0.004
  max_position_pct: 0.25
  max_total_exposure: 0.60
  max_concurrent: 2
  daily_loss_limit: 0.025    # 일 -2.5%
  daily_trade_limit: 6       # 6회전 확정 비용 1.55% < 손실한도 2.5%
  consecutive_loss_pause: 2
  cooldown_minutes: 90
  reentry_cooldown_minutes: 45
  min_order_krw: 5000
  max_order_krw: 500000
  # 업비트 최소 주문금액은 매도에도 적용된다. 5,000원어치를 사면 가격이 1%만
  # 빠져도 평가액이 4,950원이 되어 매도 주문이 거부되고, 손절이 영원히 실패한다.
  # 진입 하한 = min_order_krw × dust_guard = 10,000원. 반토막이 나도 팔 수 있다.
  dust_guard: 2.0
  # 신호 강도(ATR 여유도·손익비·거래대금)가 세 축 모두 좋을 때만 사이즈를 키운다.
  # 1.0 이면 강도와 무관하게 동일 사이즈. 키워도 max_position_pct 는 넘지 않는다.
  conviction_max: 1.6

walk_forward:
  train_bars: 1200
  test_bars: 300
  step_bars: 300

promotion:
  min_trades: 30
  min_folds: 3
  margin: 0.01
  max_drawdown: 0.15
  consistency: 0.6
  require_positive: true
