# config.yaml 로 복사해서 사용하세요. API 키는 여기 두지 말고 환경변수로 주입합니다.
#   export UPBIT_ACCESS_KEY=...
#   export UPBIT_SECRET_KEY=...

mode: paper            # paper | live  (live 는 CLI 에서 --yes-i-know 추가 필요)

engine:
  # 종목을 고정하지 않는다. BTC/ETH 는 ATR%가 손익분기에 미달해
  # 단기 타임프레임에서 구조적으로 매매가 성립하지 않는다.
  # universe_auto 가 켜져 있으면 KRW 마켓 전체(알트 포함)를 매 시간 스캔해
  # 유동성·변동성·실측 슬리피지 기준을 통과한 종목만 고른다.
  universe_auto: true
  universe_refresh_minutes: 60
  markets: []          # universe_auto: false 일 때만 사용
  candle_unit: 60      # 분봉 단위 (1,3,5,10,15,30,60,240)
  candle_count: 200
  poll_seconds: 30
  initial_krw: 1000000 # paper 전용 초기 자본
  db_path: data/ubbit.db
  log_level: INFO
  kill_switch_file: .KILL          # 이 파일을 만들면 즉시 정지 (신규진입 차단)
  dynamic_slippage: true           # 주문 직전 호가창으로 슬리피지 실측
  liquidity_min_value_krw: 100000000
  adaptive_params: false           # optimize --apply 로 승격 후 true 로 전환
  param_file: data/params.json

session:
  enabled: false       # 기본은 24시간 운용. 업무시간 대리매매는 config.scalp.yaml 참조
  start: "09:00"
  end: "18:00"
  days: [0, 1, 2, 3, 4]
  no_entry_before_close_minutes: 10
  flatten_at_close: true

universe:
  top_n: 4
  min_turnover_krw: 30000000000    # 24h 거래대금 300억 이상
  atr_cost_multiple: 4.0           # ATR% >= 손익분기 × 4 인 종목만
  atr_max_pct: 0.06
  sample_bars: 120
  probe_order_krw: 500000
  max_round_trip_cost: 0.004       # 실측 왕복비용 0.4% 초과 종목 제외
  exclude_warning: true            # 유의종목 제외

cost:
  fee_buy: 0.0005      # 업비트 KRW 마켓 매수 수수료 0.05%
  fee_sell: 0.0005     # 매도 수수료 0.05%
  slippage_buy: 0.0005 # 시장가 체결 불리분 초기 추정치 (실측으로 대체됨)
  slippage_sell: 0.0005
  min_order_krw: 5000

strategy:
  entry_mode: breakout      # breakout | squeeze | pullback
  ema_fast: 20
  ema_slow: 60
  trend_slope_lookback: 10
  breakout_period: 20
  rsi_period: 14
  rsi_min: 50
  rsi_max: 78
  atr_period: 14
  atr_cost_multiple: 4.0    # ATR% >= 손익분기 * 4 일 때만 진입 (핵심 수수료 필터)
  atr_max_pct: 0.05
  volume_period: 20
  volume_expansion: 1.2
  stop_atr: 1.5
  trail_atr: 2.0
  take_profit_atr: 3.0
  min_net_target: 0.004     # 목표 순익 하한 0.4% = 왕복비용 0.2%의 2배
  max_hold_bars: 96
  warmup_bars: 80

risk:
  risk_per_trade: 0.005     # 1회 거래 최대 손실 = 자본의 0.5%
  max_position_pct: 0.20
  max_total_exposure: 0.60
  max_concurrent: 3
  daily_loss_limit: 0.03    # 일 -3% 도달 시 당일 매매 중단
  daily_trade_limit: 8      # 회전수 상한 = 비용 드래그 상한
  consecutive_loss_pause: 3
  cooldown_minutes: 60
  reentry_cooldown_minutes: 30
  min_order_krw: 5000
  max_order_krw: 1000000
  dust_guard: 2.0        # 진입 하한 = 5,000 × 2.0 = 10,000원 (매도 불가 포지션 방지)
  conviction_max: 1.6    # 신호 강도에 따른 사이즈 배수 상한
